<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Calculator</title>
    <link rel="stylesheet" href="/FIRElife/style.css">
    <link rel="manifest" href="/FIRElife/manifest.json">
    <link rel="icon" href="/FIRElife/icon-192x192.png" sizes="192x192" />
    <link rel="icon" href="/FIRElife/icon-512x512.png" sizes="512x512" />
</head>
<body>
    <div class="calculator">
        <h2>Retirement Calculator</h2>
        <form id="retirement-form">
            <label for="capital">Capital (Initial savings): </label>
            <input type="number" id="capital" placeholder="e.g. 10000" required>
    
            <label for="interest-rate">Interest Rate (Annual %): </label>
            <input type="number" id="interest-rate" placeholder="e.g. 5" required>
    
            <label for="monthly-spent">Monthly Spent: </label>
            <input type="number" id="monthly-spent" placeholder="e.g. 2000" required>
    
            <label for="monthly-income">Monthly Income: </label>
            <input type="number" id="monthly-income" placeholder="e.g. 3000" required>
    
            <label for="target-goal">Target Retirement Goal: </label>
            <input type="number" id="target-goal" placeholder="e.g. 1000000" required>
    
            <button type="submit">Calculate</button>
        </form>
    
        <div id="result">
            <p>Your estimated retirement time: <span id="years-to-retire">N/A</span> years</p>
        </div>
    </div>

    <script src="/FIRElife/app.js"></script>
</body>
</html>
