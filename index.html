<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Calculator</title>
    <link rel="stylesheet" href="/FIRElife/style.css">
    <link rel="manifest" href="/FIRElife/manifest.json">
    <link rel="icon" href="/FIRElife/icon-192x192.png" sizes="192x192" />
    <link rel="icon" href="/FIRElife/icon-512x512.png" sizes="512x512" />
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>/</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>*</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>
            <button>0</button>
            <button>.</button>
            <button>=</button>
            <button>+</button>
            <button>Clear</button>
        </div>
    </div>
    <script src="/FIRElife/app.js"></script>
</body>
</html>
